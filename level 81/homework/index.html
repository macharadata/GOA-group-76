<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .child {
            border: 1px solid black;
            text-align: center;
        }
        /* 1 */
        
        .parent1 {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 400px;
            height: 200px;
            background: gray;
            border: 2px solid black;
        }
        
        .parent1 .child {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            background: blue;
        }
        /* 2 */
        
        .parent2 {
            display: flex;
            flex-direction: row-reverse;
            align-items: flex-end;
            width: 500px;
            height: 250px;
            background: yellow;
            border: 2px solid red;
        }
        
        .parent2 .child {
            padding: 15px;
            margin: 10px;
            font-size: 18px;
            background: green;
        }
        /* 3 */
        
        .parent3 {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
            height: 400px;
            background: lightblue;
            border: 2px solid black;
        }
        
        .parent3 .child {
            padding: 10px;
            margin: 8px;
            font-size: 14px;
            background: orange;
        }
        /* 4 */
        
        .parent4 {
            display: flex;
            flex-direction: column-reverse;
            width: 350px;
            height: 300px;
            background: lightgreen;
            border: 2px solid blue;
        }
        
        .parent4 .child {
            padding: 12px;
            margin: 6px;
            font-size: 16px;
            background: violet;
        }
        /* 5 */
        
        .parent5 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 300px;
            background: lightgreen;
            border: 2px solid blue;
        }
        
        .parent5 .child {
            padding: 15px;
            margin: 30px;
            font-size: 15px;
            background: orange;
        }
        /* 6 */
        
        .parent6 {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: center;
            width: 450px;
            height: 220px;
            background: lightyellow;
            border: 2px solid red;
        }
        
        .parent6 .child {
            padding: 13px;
            margin: 40px;
            font-size: 25px;
            background: green;
        }
        /* 7 */
        
        .parent7 {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 300px;
            height: 350px;
            background: lightblue;
            border: 2px solid black;
        }
        
        .parent7 .child {
            padding: 20px;
            margin: 20px;
            font-size: 14px;
            background: orange;
        }
        /* 8 */
        
        .parent8 {
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
            align-items: center;
            width: 350px;
            height: 300px;
            background: pink;
            border: 2px solid blue;
        }
        
        .parent8 .child {
            padding: 30px;
            margin: 30px;
            font-size: 16px;
            background: violet;
        }
        /* 9 */
        
        .parent9 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            width: 300px;
            height: 400px;
            background: red;
            border: 2px solid purple;
        }
        
        .parent9 .child {
            padding: 40px;
            margin: 40px;
            font-size: 15px;
            background: skyblue;
        }
    </style>
</head>

<body>

    <!-- 1 -->
    <div class="parent1">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 2 -->
    <div class="parent2">
        <div class="child">1</div>

        <div class="child">3</div>

        <div class="child">5</div>

    <!-- 3 -->

    <!-- 4 -->

        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>

    <!-- 5 -->
    <div class="parent5">
        <div class="child">1</div>

        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 6 -->
    <div class="parent6">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 7 -->
    <div class="parent7">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 8 -->
    <div class="parent8">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 9 -->
    <div class="parent9">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>

    </div>

</body>

</html>
