<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smooth Div Animation</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <main class="scene">
    <h1 class="title">Smooth Animation</h1>
    <p class="subtitle">A single div animated with JavaScript and CSS.</p>

    <div class="stage" id="stage" aria-label="Animation area">
      <div class="box" id="box" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    const box = document.getElementById("box");
    const stage = document.getElementById("stage");

    let width = 0;
    let height = 0;
    let start = performance.now();

    function measure() {
      const stageRect = stage.getBoundingClientRect();
      const boxRect = box.getBoundingClientRect();
      width = Math.max(0, stageRect.width - boxRect.width);
      height = Math.max(0, stageRect.height - boxRect.height);
    }

    function animate(now) {
      const t = (now - start) / 1000;
      const x = (Math.sin(t) + 1) / 2 * width;
      const y = (Math.cos(t * 0.9) + 1) / 2 * height;
      const scale = 0.9 + (Math.sin(t * 2) + 1) * 0.05;

      box.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", measure);
    measure();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
