<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            width: 500px;
            height: 500px;
            border: 2px solid red;
            display: flex;
        }
        
        .child {
            width: 100px;
            height: 100px;
            background: blue;
        }
        
        .parent1 {
            justify-content: space-evenly;
            align-items: flex-end;
        }
        
        .parent2 {
            justify-content: space-between;
            align-items: center;
        }
        
        .parent3 {
            justify-content: space-around;
            align-items: flex-start;
        }
        
        .parent3 {
            padding-left: 50px;
            padding-right: 50px;
        }
    </style>
</head>

<body>
    <div class="parent parent1">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>

    <div class="parent parent2">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>

    <div class="parent parent3">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>

</html>
