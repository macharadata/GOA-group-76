<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        /* ---------------- 1)  ---------------- */
        /*
flex-grow განსაზღვრავს რამდენად გაიზრდება ელემენტი თავისუფალი სივრცის არსებობისას

0  -> არ იზრდება
1  -> იზრდება თანაბრად
2+ -> პროპორციულად უფრო მეტ სივრცეს იკავებს
*/
        /* ---------------- 2)  ---------------- */
        
        .container2 {
            display: flex;
        }
        
        .container2 .item {
            width: 100px;
            height: 80px;
            background: gray;
            margin: 5px;
        }
        
        .container2 .grow {
            flex-grow: 1;
        }
        /* ---------------- 3)  ---------------- */
        
        .nav {
            display: flex;
            align-items: center;
            background: #222;
            padding: 10px;
        }
        
        .logo {
            width: 50px;
        }
        
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
        }
        
        .menu a {
            color: white;
            text-decoration: none;
        }
        
        .nav button {
            padding: 8px 16px;
        }
        /* ---------------- 4) ---------------- */
        
        .box {
            display: flex;
        }
        
        .box .item {
            flex: 1;
            height: 80px;
            background: gray;
            margin: 5px;
            transition: 0.3s;
        }
        
        .box .item:hover {
            background: orange;
        }
        
        .box .third:hover {
            flex-grow: 3;
        }
        /* ---------------- 5) ---------------- */
        
        .wrap {
            display: flex;
        }
        
        .wrap .item {
            flex-basis: 150px;
            height: 80px;
            background: teal;
            margin: 5px;
        }
        /* ---------------- 6)  ---------------- */
        
        .row {
            display: flex;
        }
        
        .a {
            flex-basis: 100px;
            background: red;
        }
        
        .b {
            flex-basis: 200px;
            background: blue;
        }
        
        .c {
            flex-basis: 300px;
            background: green;
        }
        
        .d {
            flex-basis: 150px;
            background: purple;
        }
        
        .row div {
            height: 80px;
        }
        /* ---------------- 7)  ---------------- */
        /*
flex-shrink განსაზღვრავს რამდენად შემცირდება ელემენტი როცა ადგილი არ ჰყოფნის

1 -> ნორმალური შემცირება
0 -> არ შემცირდება
2+ -> უფრო სწრაფად შემცირდება
*/
        /* ---------------- 8) ---------------- */
        
        .container8 {
            display: flex;
            width: 400px;
        }
        
        .container8 .item {
            flex-basis: 200px;
            flex-shrink: 1;
            background: gray;
            margin: 5px;
        }
        
        .container8 .no-shrink {
            flex-shrink: 0;
        }
        /* ---------------- 9 ---------------- */
        
        .container9 {
            display: flex;
            width: 400px;
        }
        
        .container9 .item {
            flex-basis: 200px;
            background: gray;
            margin: 5px;
        }
        
        .s1 {
            flex-shrink: 1;
        }
        
        .s2 {
            flex-shrink: 2;
        }
        
        .s3 {
            flex-shrink: 3;
        }
        /* ---------------- 10)  ---------------- */
        
        .container10 {
            display: flex;
            flex-wrap: wrap;
            width: 400px;
        }
        
        .container10 .item {
            flex-basis: 300px;
            flex-shrink: 0;
            height: 80px;
            background: teal;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>2) flex-grow</h2>
    <div class="container2">
        <div class="item">1</div>
        <div class="item grow">2</div>
        <div class="item">3</div>
    </div>


    <h2>3) Navbar</h2>
    <div class="nav">
        <img src="https://via.placeholder.com/50" class="logo">
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <button>Login</button>
    </div>


    <h2>4) Hover Grow</h2>
    <div class="box">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item third">3</div>
    </div>


    <h2>5) flex-basis only</h2>
    <div class="wrap">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>


    <h2>6) Different sizes</h2>
    <div class="row">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
    </div>


    <h2>8) shrink control</h2>
    <div class="container8">
        <div class="item">1</div>
        <div class="item no-shrink">2</div>
        <div class="item">3</div>
    </div>


    <h2>9) different shrink</h2>
    <div class="container9">
        <div class="item s1">1</div>
        <div class="item s2">2</div>
        <div class="item s3">3</div>
    </div>


    <h2>10) wrap no shrink</h2>
    <div class="container10">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

</body>

</html>
