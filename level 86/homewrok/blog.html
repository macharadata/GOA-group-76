<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Card</title>
    <link rel="stylesheet" href="blog.css">
</head>

<body>

    <main class="wrapper">
        <article class="card">
            <img src="image.png" class="card__img">

            <div class="card__content">
                <span class="card__tag">Learning</span>

                <p class="card__date">Published 21 Dec 2023</p>

                <h2 class="card__title">
                    HTML & CSS foundations
                </h2>

                <p class="card__text">
                    These languages are the backbone of every website, defining structure, content, and presentation.
                </p>

                <div class="author">
                    <img src="Screenshot 2026-05-02 195826.png" class="author__img">
                    <span class="author__name">Greg Hooper</span>
                </div>
            </div>
        </article>
    </main>

</body>

</html>
