<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        /* 1 */
        
        .p1 {
            margin-top: 20px;
        }
        
        .p2 {
            margin-left: 10px;
        }
        
        .p3 {
            margin-right: 15px;
        }
        
        .p4 {
            margin-bottom: 5px;
        }
        /* 2 */
        
        .div2 {
            border: 2px solid black;
            color: red;
            background-color: blue;
            height: 300px;
            width: 300px;
            padding: 100px;
        }
        /* 3 */
        
        .div3 {
            border: 2px solid black;
            color: green;
            background-color: pink;
            height: 250px;
            width: 250px;
            padding: 200px 150px;
        }
        
        .div3 button {
            padding: 20px;
        }
        /* 4 */
        
        .div4 {
            border: 3px solid red;
            color: blue;
            background-color: violet;
            display: inline-block;
        }
        
        .div4 img {
            margin: 25px 60px 45px 89px;
        }
        /* 5 */
        
        .div5 {
            border: 6px solid yellow;
            background-color: brown;
            height: 150px;
            width: 150px;
        }
        
        .div5 button {
            margin-top: 900px;
            padding-bottom: 50px;
        }
        /* 6 */
        
        .input1 {
            border: 10px solid green;
        }
        /* 7 */
        
        .input2 {
            width: 200px;
            height: 40px;
            color: white;
            background-color: black;
            border-top: 5px solid red;
            border-right: 5px solid blue;
            border-bottom: 5px solid green;
            border-left: 5px solid yellow;
        }
        /* 8 */
        
        .block8 {
            margin: 148px;
        }
        
        .btn8 {
            padding: 60px 40px;
            border-top: 5px solid red;
            border-right: 5px solid blue;
            border-bottom: 5px solid green;
            border-left: 5px solid yellow;
        }
    </style>
</head>

<body>

    <!-- 1 -->
    <p class="p1">1</p>
    <p class="p2">2</p>
    <p class="p3">3</p>
    <p class="p4">4</p>

    <!-- 2 -->
    <div class="div2">DIV 2</div>

    <!-- 3 -->
    <div class="div3">
        <button>Button</button>
    </div>

    <!-- 4 -->
    <div class="div4">
        <img src="" alt="">
    </div>

    <!-- 5 -->
    <div class="div5">
        <button>Button</button>
    </div>

    <!-- 6 -->
    <input class="input1" type="text" placeholder="Input 1">

    <!-- 7 -->
    <input class="input2" type="text" placeholder="Input 2">

    <!-- 8 -->
    <div class="block8">
        <p>Paragraph</p>
        <button class="btn8">Button</button>
        <h1>Titel</h1>
    </div>

</body>

</html>
