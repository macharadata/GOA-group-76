<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Buttons</title>
    <style>
        button {
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        
        .uno {
            padding: 40px 100px;
        }
        
        .dos {
            padding: 64px;
        }
        
        .dres {
            padding: 50px 20px 15px 70px;
        }
        
        .quatro {
            padding-top: 45px;
        }
    </style>
</head>

<body>

    <button class="uno">1</button>
    <button class="dos">2</button>
    <button class="dres">buckle my</button>
    <button class="quatro">shoeeeeeeeeeees</button>

</body>

</html>
