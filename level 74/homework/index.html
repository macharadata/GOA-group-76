<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Task</title>
    <style>
        /* 1 */
        .linka:link {
            color: blue;
            font-size: 18px;
            text-decoration: none;
        }

        /* 2 */
        .linkb:hover {
            font-weight: bold;
            color: red;
        }

        /* 3 */
        .linkg:visited {
            color: purple;
            font-family: Arial;
        }

        /* 4 */
        .linkd:active {
            background-color: yellow;
            border: 2px solid black;
        }

        /* 5 */
        .linke:hover {
            text-decoration: underline;
            color: green;
            font-size: 20px;
        }

        /* 6 */
        .linkv:visited {
            background-color: lightgray;
            color: darkblue;
            text-align: center;
        }

        /* 7 */
        .linkz:link {
            color: yellow;
            font-family: Verdana;
        }

        .linkz:active {
            border: 3px solid red;
            background-color: pink;
        }
    </style>
</head>

<body>

    <a href="#" class="linka">Link 1</a><br><hr>
    <a href="#" class="linkb">Link 2</a><br><hr>
    <a href="#" class="linkg">Link 3</a><br><hr>
    <a href="#" class="linkd">Link 4</a><br><hr>
    <a href="#" class="linke">Link 5</a><br><hr>
    <a href="#" class="linkv">Link 6</a><br><hr>
    <a href="#" class="linkz">Link 7</a>

</body>

</html>
